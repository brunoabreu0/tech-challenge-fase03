name: CI — Lint, Test & Build

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint (Ruff)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Run Ruff Linting
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2: Test (Pytest)
  # ---------------------------------------------------------------------------
  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Set up Kaggle Credentials
        if: ${{ env.KAGGLE_API_TOKEN != '' }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"token\": \"${KAGGLE_API_TOKEN}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Run Tests with Coverage
        run: poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Job 3: Build Docker Image (apenas push para main)
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          docker image prune --all --force

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (com retry resiliente)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Tentativa $i: autenticando no Docker Hub..."
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              echo "✅ Autenticado com sucesso no Docker Hub."
              exit 0
            fi
            echo "⚠️ Falha transitória na conexão (tentativa $i). Retentando em $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "❌ Falha ao autenticar no Docker Hub após 5 tentativas."
          exit 1

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medical-triage-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medical-triage-api:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Job 4: Continuous Deployment (EC2 via AWS SSM)
  # ---------------------------------------------------------------------------
  deploy:
    name: Continuous Deployment (AWS SSM)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: sa-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          echo "🔍 Localizando instância EC2 em execução com a tag Name=medical-triage-nlp-api-server..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region sa-east-1 \
            --filters "Name=tag:Name,Values=*triage*api-server,medical-triage-fase03-api-server,medical-triage-nlp-api-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "⚠️ Nenhuma instância EC2 ativa encontrada. Pulando o deploy automático."
            exit 0
          fi

          echo "✅ Instância EC2 encontrada: ${INSTANCE_ID}"
          echo "🚀 Enviando comando de atualização da stack via AWS SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --region sa-east-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Auto-Deploy via GitHub Actions" \
            --parameters 'commands=[
              "set -euxo pipefail",
              "mkdir -p /opt/triage/models /opt/triage/data/raw /opt/triage/data/processed",
              "chmod -R 777 /opt/triage/models /opt/triage/data",
              "cd /opt/triage/repo",
              "git pull --ff-only origin main",
              "set +x",
              "if [ -n \"${{ secrets.DOCKERHUB_TOKEN }}\" ]; then echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin >/dev/null 2>&1 || true; fi",
              "set -x",
              "docker pull techchallengefase02/medical-triage-api:latest || true",
              "if ! docker image inspect triage-airflow:2.10.0 >/dev/null 2>&1; then docker build -t triage-airflow:2.10.0 -f Dockerfile.airflow . ; fi",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "sleep 5",
              "curl -s -f http://localhost:8000/health",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "✅ Comando SSM disparado: ${COMMAND_ID}"
          echo "⏳ Aguardando conclusão do deploy no servidor..."
          aws ssm wait command-executed \
            --region sa-east-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          echo "📋 Verificando log de execução e healthcheck do servidor:"
          aws ssm get-command-invocation \
            --region sa-east-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status: Status, ResponseCode: ResponseCode, Output: StandardOutputContent, Error: StandardErrorContent}" \
            --output json

          DEPLOY_STATUS=$(aws ssm get-command-invocation \
            --region sa-east-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$DEPLOY_STATUS" != "Success" ]; then
            echo "❌ O deploy remoto via AWS SSM falhou com status: $DEPLOY_STATUS"
            exit 1
          fi

          echo "🎉 Deploy concluído com sucesso via SSM!"

