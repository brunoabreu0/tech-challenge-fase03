x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0-python3.12
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__WEBSERVER__SECRET_KEY: "fiap-9mlet-grupo17-fase03"
    # Paths para o código e modelos do projecto
    DATA_RAW_DIR: /opt/airflow/data/raw
    DATA_PROCESSED_DIR: /opt/airflow/data/processed
    MODEL_DIR: /opt/airflow/models
    SRC_DIR: /opt/airflow/src
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./models:/opt/airflow/models
    - ./data:/opt/airflow/data
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — backend do Airflow
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Airflow Init — cria as tabelas e o utilizador admin
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install scikit-learn pandas numpy joblib skl2onnx onnxruntime pydantic pydantic-settings python-dotenv &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: "no"

  # ---------------------------------------------------------------------------
  # Airflow Webserver — UI em localhost:8080
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Scheduler — executa as DAGs
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
