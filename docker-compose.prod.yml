# ==============================================================================
# docker-compose.prod.yml — Deploy em produção (EC2)
# Usa imagem pré-compilada do Docker Hub em vez de build local
# ==============================================================================
services:
  # ---------------------------------------------------------------------------
  # API de Triagem Médica
  # ---------------------------------------------------------------------------
  api:
    image: techchallengefase02/medical-triage-api:latest
    container_name: triage-api
    ports:
      - "8000:8000"
    volumes:
      - models-data:/workspace/models
      - raw-data:/workspace/data/raw
    environment:
      APP_ENV: production
      MODEL_DIR: models
      MODEL_NAME: onnx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus — coleta métricas da API
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: triage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - /opt/triage/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Grafana — visualização das métricas (dashboard automático)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: triage-grafana
    ports:
      - "3000:3000"
    volumes:
      - /opt/triage/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/triage/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.triage.cloud-ip.cc
      GF_SERVER_ROOT_URL: "https://grafana.triage.cloud-ip.cc"
      GF_LOG_LEVEL: warn
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  models-data:
  raw-data:
  prometheus-data:
  grafana-data:
