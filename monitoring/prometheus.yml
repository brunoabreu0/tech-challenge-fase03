global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "prometheus.triage.cloud-ip.cc"

  - job_name: "medical-triage-api"
    scheme: https
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["api.triage.cloud-ip.cc"]
        labels:
          instance: "api.triage.cloud-ip.cc"
